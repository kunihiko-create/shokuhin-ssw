<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品製造SSW 試験対策</title>
<style>
  :root {
    --main: #BA7517;
    --main-dark: #8f5a10;
    --main-light: #fbf1e1;
    --main-mid: #ecd0a0;
    --ok: #15803d;
    --ok-light: #dcfce7;
    --ng: #b91c1c;
    --ng-light: #fee2e2;
    --white: #ffffff;
    --gray: #6b7280;
    --gray-light: #f3f4f6;
    --line: #e5e7eb;
    --text: #1f2937;
    --text-sub: #6b7280;
    --shadow: 0 4px 20px rgba(0,0,0,0.10);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Noto Sans JP', sans-serif;
    background: #fbf8f3; color: var(--text); min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; cursor: pointer; }
  ruby rt { font-size: 0.55em; color: var(--text-sub); }
  .wrap { max-width: 600px; margin: 0 auto; padding: 16px; }

  /* ===== HEADER ===== */
  header {
    background: var(--main); color: white; padding: 12px 16px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 10px rgba(186,117,23,0.35);
  }
  .header-inner { max-width: 600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .header-title { font-size: 1.02rem; font-weight: bold; line-height: 1.3; cursor: pointer; }
  .header-title small { display: block; font-size: 0.7rem; font-weight: normal; opacity: 0.85; }
  .toggles { display: flex; gap: 6px; flex-shrink: 0; }
  .tg {
    border: 1.5px solid rgba(255,255,255,0.7); background: transparent; color: white;
    border-radius: 20px; padding: 4px 10px; font-size: 0.72rem; font-weight: bold;
  }
  .tg.on { background: white; color: var(--main); border-color: white; }

  /* ===== CARDS / BUTTONS ===== */
  .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 1rem; margin-bottom: 10px; }
  .sub { color: var(--text-sub); font-size: 0.78rem; }
  .btn {
    display: block; width: 100%; border: none; border-radius: 12px; padding: 14px 16px;
    font-size: 0.98rem; font-weight: bold; background: var(--main); color: white;
    transition: transform .1s, background .2s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: #d1d5db; color: #9ca3af; cursor: default; }
  .btn.sec { background: var(--gray-light); color: var(--text); }
  .btn.ghost { background: white; color: var(--main); border: 2px solid var(--main-mid); }
  .btn rt { color: inherit; opacity: 0.8; }
  .btn small { display: block; font-weight: normal; font-size: 0.72rem; opacity: 0.85; margin-top: 2px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .mt { margin-top: 10px; }

  .menu-btn {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: white; border: 2px solid var(--line); border-radius: 14px; padding: 14px;
    margin-bottom: 10px; color: var(--text);
  }
  .menu-btn:active { background: var(--main-light); }
  .menu-btn .ic { font-size: 1.7rem; width: 40px; text-align: center; flex-shrink: 0; }
  .menu-btn b { display: block; font-size: 0.98rem; }
  .menu-btn span { font-size: 0.75rem; color: var(--text-sub); }

  .due-box {
    background: linear-gradient(135deg, var(--main), var(--main-dark)); color: white;
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .due-num { font-size: 2.2rem; font-weight: bold; line-height: 1.1; }
  .due-box rt { color: rgba(255,255,255,0.85); }
  .due-box .btn { background: white; color: var(--main); margin-top: 12px; }
  .due-box .btn:disabled { background: rgba(255,255,255,0.4); color: white; }

  .stat-row { display: flex; justify-content: space-around; text-align: center; }
  .stat-row b { display: block; font-size: 1.4rem; color: var(--main); }
  .stat-row span { font-size: 0.72rem; color: var(--text-sub); }

  /* category chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 8px 12px; border-radius: 20px; border: 2px solid var(--line); background: white;
    font-size: 0.82rem; font-weight: bold; color: var(--gray);
  }
  .chip.on { background: var(--main); border-color: var(--main); color: white; }
  .chip small { font-weight: normal; opacity: 0.8; }

  /* bars */
  .bar-row { display: grid; grid-template-columns: 10.5em 1fr 3.2em; align-items: center; gap: 8px; font-size: 0.8rem; margin: 7px 0; }
  .bar { height: 10px; background: var(--gray-light); border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #f59e0b; border-radius: 6px; }
  .bar i.good { background: var(--ok); }
  .bar i.weak { background: var(--ng); }
  .bar-row .pct { text-align: right; font-weight: bold; }

  /* ===== QUIZ ===== */
  .qbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-size: 0.8rem; }
  .qbar .close { border: none; background: var(--gray-light); border-radius: 20px; padding: 6px 12px; font-weight: bold; color: var(--gray); }
  .timer { font-weight: bold; font-variant-numeric: tabular-nums; background: white; border-radius: 20px; padding: 5px 12px; box-shadow: var(--shadow); }
  .timer.low { color: var(--ng); }
  .progress { height: 6px; background: #efdcbf; border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .progress i { display: block; height: 100%; background: var(--main); transition: width .3s; }
  .badge { display: inline-block; background: var(--main-light); color: var(--main-dark); border-radius: 12px; padding: 3px 10px; font-size: 0.72rem; font-weight: bold; margin-bottom: 10px; }
  .qtype { display: inline-block; background: var(--gray-light); color: var(--gray); border-radius: 12px; padding: 3px 10px; font-size: 0.72rem; font-weight: bold; margin-left: 4px; }
  .qtext { font-size: 1.12rem; line-height: 2.0; font-weight: bold; }
  .passage { white-space: pre-line; background: #fdf9f3; border-left: 4px solid var(--main); border-radius: 8px; padding: 10px 12px; margin: 4px 0 12px; line-height: 2.0; font-size: 0.98rem; }
  .passage + .idn { white-space: pre-line; margin: -6px 0 12px; }
  .yomi { display: block; font-size: 0.72rem; color: var(--text-sub); font-weight: normal; line-height: 1.5; margin-top: 2px; }
  .idn { display: block; color: #2563eb; font-size: 0.84rem; line-height: 1.5; margin-top: 6px; font-weight: normal; }

  .listen { display: flex; gap: 10px; margin-bottom: 14px; }
  .listen button {
    flex: 1; border: none; border-radius: 12px; padding: 14px 8px; font-weight: bold; font-size: 0.95rem;
    background: var(--main-light); color: var(--main-dark);
  }
  .listen button.main { background: var(--main); color: white; font-size: 1.05rem; }
  .warn { background: #fef3c7; color: #92400e; border-radius: 10px; padding: 10px 12px; font-size: 0.8rem; margin-bottom: 12px; }

  .opts { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .opt {
    display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
    background: white; border: 2px solid var(--line); border-radius: 14px; padding: 13px 14px;
    font-size: 1rem; line-height: 1.85; color: var(--text); transition: border-color .15s, background .15s;
  }
  .opt .no {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--gray-light);
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; margin-top: 3px;
  }
  .opt.sel { border-color: var(--main); background: var(--main-light); }
  .opt.sel .no { background: var(--main); color: white; }
  .opt.ok { border-color: var(--ok); background: var(--ok-light); }
  .opt.ok .no { background: var(--ok); color: white; }
  .opt.ng { border-color: var(--ng); background: var(--ng-light); }
  .opt.ng .no { background: var(--ng); color: white; }
  .opt:disabled { cursor: default; }
  .tf { display: flex; gap: 12px; margin-top: 16px; }
  .tf .opt { flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 14px 8px; }
  .tf .mark { font-size: 2.2rem; line-height: 1.1; font-weight: bold; }
  .tf .lbl { font-size: 0.85rem; font-weight: bold; line-height: 1.4; }
  .tf .lbl small { display: block; font-weight: normal; color: var(--text-sub); }

  .fb { margin-top: 16px; border-radius: 14px; padding: 14px; line-height: 1.9; font-size: 0.95rem; }
  .fb.ok { background: var(--ok-light); border: 2px solid #86efac; }
  .fb.ng { background: var(--ng-light); border: 2px solid #fca5a5; }
  .fb .res { font-weight: bold; font-size: 1.05rem; margin-bottom: 4px; }
  .fb .ans { font-weight: bold; margin-bottom: 6px; }
  .fb .script { background: rgba(255,255,255,0.7); border-radius: 10px; padding: 8px 10px; margin-top: 8px; }
  .fb .script button { border: none; background: var(--main); color: white; border-radius: 14px; padding: 2px 10px; font-size: 0.75rem; margin-left: 6px; }

  .qfoot { display: flex; gap: 10px; margin-top: 16px; }
  .qfoot .btn { flex: 1; }
  .unans { text-align: center; font-size: 0.78rem; color: var(--text-sub); margin-top: 8px; }

  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 14px; }
  .grid button { border: none; border-radius: 6px; padding: 6px 0; font-size: 0.7rem; background: var(--gray-light); color: var(--gray); }
  .grid button.done { background: var(--main-mid); color: var(--main-dark); font-weight: bold; }
  .grid button.cur { outline: 2px solid var(--main); }

  /* ===== RESULT ===== */
  .score { text-align: center; padding: 8px 0 4px; }
  .score .big { font-size: 3rem; font-weight: bold; color: var(--main); line-height: 1.1; }
  .score .big small { font-size: 1.1rem; color: var(--text-sub); }
  .pass { display: inline-block; margin-top: 8px; border-radius: 20px; padding: 5px 16px; font-weight: bold; font-size: 0.9rem; }
  .pass.y { background: var(--ok-light); color: var(--ok); }
  .pass.n { background: var(--ng-light); color: var(--ng); }
  details.wrong { border-top: 1px solid var(--line); padding: 10px 0; }
  details.wrong summary { cursor: pointer; line-height: 1.8; font-size: 0.92rem; list-style: none; }
  details.wrong summary::before { content: '▶ '; color: var(--main); font-size: 0.7rem; }
  details.wrong[open] summary::before { content: '▼ '; }
  details.wrong .body { font-size: 0.88rem; line-height: 1.85; margin-top: 6px; background: var(--gray-light); border-radius: 10px; padding: 10px; }
  .hist { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding: 8px 0; font-size: 0.85rem; }

  /* ===== LOGIN ===== */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #login .card { width: 100%; max-width: 380px; text-align: center; }
  #login .logo { font-size: 2.6rem; }
  #login h1 { font-size: 1.15rem; margin: 6px 0 2px; }
  #login input {
    width: 100%; padding: 13px; border: 2px solid var(--line); border-radius: 12px; font-size: 1rem; margin: 16px 0 10px;
  }
  #login input:focus { outline: none; border-color: var(--main); }
  .login-error { color: var(--ng); font-size: 0.82rem; margin-top: 8px; display: none; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: white;
    padding: 10px 18px; border-radius: 20px; font-size: 0.85rem; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 200;
  }
  .toast.show { opacity: 0.92; }
  a.link { color: var(--main); font-weight: bold; text-decoration: none; }
  .oimg { display: block; max-width: 100%; max-height: 150px; margin-top: 4px; border-radius: 8px; background: #fff; }
  .qimg { display: block; max-width: 100%; max-height: 260px; margin: 10px auto 0; border-radius: 8px; background: #fff; }
  .ansimg { display: block; max-height: 110px; border-radius: 6px; margin-top: 4px; background: #fff; }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="card">
    <div class="logo">🍱</div>
    <h1>食品製造SSW 試験対策</h1>
    <div class="sub">Persiapan Ujian SSW Makanan & Minuman</div>
    <input type="password" id="pw" placeholder="パスワード / Kata sandi" onkeydown="if(event.key==='Enter') doLogin()">
    <button class="btn" onclick="doLogin()">ログイン / Masuk</button>
    <div class="login-error" id="loginError">❌ パスワードが違います / Kata sandi salah</div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" style="display:none">
  <header>
    <div class="header-inner">
      <div class="header-title" onclick="go('home')">🍱 食品製造SSW 試験対策<small>Persiapan Ujian SSW Makanan & Minuman</small></div>
      <div class="toggles">
        <button class="tg" id="tgFuri" onclick="toggleSet('furi')">ふりがな</button>
        <button class="tg" id="tgIdn" onclick="toggleSet('idn')">ID</button>
      </div>
    </div>
  </header>
  <main class="wrap" id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
// 問題データ：学科試験（食品衛生・危害要因・一般衛生管理・HACCP）オリジナル問題
// 内容はOTAFF「特定技能1号評価試験 学習用テキスト（飲食料品製造業）第5.1版（2026年4月）」に基づく。
// 本番と同じく3択。漢字《よみ》でふりがな。a＝正解の番号。
window.QB = window.QB || [];
QB.push(
// ===== 食品衛生の一般的知識 =====
{id:'ei01',c:'e_ippan',t:'mc',
 q:'「食品衛生《しょくひんえいせい》」の意味《いみ》として、正《ただ》しいものはどれか。',
 qi:'Manakah arti "kebersihan/keamanan pangan" yang benar?',
 o:['食品《しょくひん》を食《た》べた人《ひと》が、病気《びょうき》になったりケガをしたりしないこと','食品《しょくひん》を安《やす》く作《つく》ること','食品《しょくひん》をたくさん作《つく》ること'],
 oi:['Orang yang makan makanan tidak sakit atau cedera','Membuat makanan dengan murah','Membuat makanan dalam jumlah banyak'],
 a:0,
 e:'食品衛生《しょくひんえいせい》とは、食品《しょくひん》を食《た》べた人《ひと》が病気《びょうき》やケガをしないこと。衛生管理《えいせいかんり》が不十分《ふじゅうぶん》だと、食《た》べた人《ひと》が病気《びょうき》になり、会社《かいしゃ》の信用《しんよう》もなくなる。',
 ei:'Keamanan pangan berarti orang yang makan tidak sakit atau cedera. Jika manajemen kebersihan kurang, orang yang makan bisa sakit dan perusahaan kehilangan kepercayaan.'},
{id:'ei02',c:'e_ippan',t:'mc',
 q:'どんな食品《しょくひん》を作《つく》るときも、どこの作業場《さぎょうば》でも共通《きょうつう》して行《おこな》う基本的《きほんてき》な衛生管理《えいせいかんり》を何《なん》というか。',
 qi:'Manajemen kebersihan dasar yang dilakukan sama di semua tempat kerja, makanan apa pun yang dibuat, disebut apa?',
 o:['一般衛生管理《いっぱんえいせいかんり》','重要管理点《じゅうようかんりてん》','管理基準《かんりきじゅん》'],
 oi:['Manajemen kebersihan umum','Titik kendali kritis','Batas kritis'],
 a:0,
 e:'手洗《てあら》い・正《ただ》しい作業服《さぎょうふく》・清潔《せいけつ》な設備《せつび》・原材料《げんざいりょう》の温度管理《おんどかんり》など、共通《きょうつう》の基本《きほん》が一般衛生管理《いっぱんえいせいかんり》。',
 ei:'Hal dasar bersama seperti cuci tangan, baju kerja yang benar, peralatan bersih, dan pengelolaan suhu bahan baku adalah manajemen kebersihan umum.'},
{id:'ei03',c:'e_ippan',t:'mc',
 q:'一般衛生管理《いっぱんえいせいかんり》に含《ふく》まれないものはどれか。',
 qi:'Manakah yang TIDAK termasuk manajemen kebersihan umum?',
 o:['製品《せいひん》の値段《ねだん》を決《き》めること','作業者《さぎょうしゃ》の衛生管理《えいせいかんり》','施設《しせつ》・設備《せつび》・器具《きぐ》の衛生管理《えいせいかんり》'],
 oi:['Menentukan harga produk','Manajemen kebersihan pekerja','Manajemen kebersihan fasilitas, peralatan, perkakas'],
 a:0,
 e:'一般衛生管理《いっぱんえいせいかんり》は、5S、施設《しせつ》・設備《せつび》・器具《きぐ》、作業者《さぎょうしゃ》、原材料《げんざいりょう》・食品《しょくひん》の衛生管理《えいせいかんり》。値段《ねだん》は関係《かんけい》ない。',
 ei:'Manajemen kebersihan umum mencakup 5S, fasilitas/peralatan/perkakas, pekerja, serta bahan baku/makanan. Harga tidak terkait.'},
{id:'ei04',c:'e_ippan',t:'mc',
 q:'「HACCP（ハサップ）」の日本語《にほんご》訳《やく》として正《ただ》しいものはどれか。',
 qi:'Manakah terjemahan Jepang yang benar untuk "HACCP"?',
 o:['危害要因分析重要管理点《きがいよういんぶんせきじゅうようかんりてん》','整理整頓清掃《せいりせいとんせいそう》','先入《さきい》れ先出《さきだ》し'],
 oi:['Analisis bahaya dan titik kendali kritis','Ringkas, rapi, resik','Masuk pertama keluar pertama'],
 a:0,
 e:'HACCPはHazard Analysis and Critical Control Pointの略《りゃく》で、「危害要因分析重要管理点《きがいよういんぶんせきじゅうようかんりてん》」と訳《やく》す。',
 ei:'HACCP adalah singkatan Hazard Analysis and Critical Control Point, diterjemahkan "analisis bahaya dan titik kendali kritis".'},
{id:'ei05',c:'e_ippan',t:'mc',
 q:'人《ひと》が病気《びょうき》になったりケガをしたりする原因《げんいん》になるものを何《なん》というか。',
 qi:'Sesuatu yang menjadi penyebab orang sakit atau cedera disebut apa?',
 o:['危害要因《きがいよういん》（ハザード）','品質《ひんしつ》','規格《きかく》'],
 oi:['Faktor bahaya (hazard)','Mutu','Standar/spesifikasi'],
 a:0,
 e:'危害要因《きがいよういん》（ハザード）には、物理的《ぶつりてき》・化学的《かがくてき》・生物的《せいぶつてき》の3つがある。',
 ei:'Faktor bahaya (hazard) ada 3: fisik, kimia, dan biologis.'},
{id:'ei06',c:'e_ippan',t:'mc',
 q:'特定技能《とくていぎのう》1号《ごう》（飲食料品製造業《いんしょくりょうひんせいぞうぎょう》）で働《はたら》くために必要《ひつよう》な知識《ちしき》・技能《ぎのう》の2つの柱《はしら》はどれか。',
 qi:'Apa dua pilar pengetahuan/keterampilan yang diperlukan untuk bekerja sebagai SSW 1 bidang manufaktur makanan & minuman?',
 o:['食品衛生《しょくひんえいせい》と労働安全《ろうどうあんぜん》','営業《えいぎょう》と経理《けいり》','運転《うんてん》と通訳《つうやく》'],
 oi:['Keamanan pangan dan keselamatan kerja','Penjualan dan akuntansi','Mengemudi dan menerjemahkan'],
 a:0,
 e:'どの業種《ぎょうしゅ》でも、「食品衛生《しょくひんえいせい》」と「労働安全《ろうどうあんぜん》」の知識《ちしき》・技能《ぎのう》が必要《ひつよう》。試験《しけん》もこの2つから出題《しゅつだい》される。',
 ei:'Di semua jenis usaha, diperlukan pengetahuan dan keterampilan "keamanan pangan" dan "keselamatan kerja". Ujian juga mencakup kedua hal ini.'},
{id:'ei07',c:'e_ippan',t:'mc',
 q:'清潔《せいけつ》でない人《ひと》や物《もの》が、清潔《せいけつ》な人《ひと》や物《もの》に触《ふ》れて、危害要因《きがいよういん》が移《うつ》ることを何《なん》というか。',
 qi:'Faktor bahaya yang berpindah karena orang/benda yang tidak bersih menyentuh orang/benda yang bersih disebut apa?',

 oi:['Kontaminasi silang','Sterilisasi dengan pemanasan','Masuk pertama keluar pertama'],
 a:0,
 e:'交差汚染《こうさおせん》を防《ふせ》ぐために、施設《しせつ》・設備《せつび》・器具《きぐ》を正《ただ》しく使《つか》い分《わ》け、清潔《せいけつ》を保《たも》つ。',
 ei:'Untuk mencegah kontaminasi silang, fasilitas, peralatan, dan perkakas digunakan secara terpisah dengan benar dan dijaga kebersihannya.'},
{id:'ei08',c:'e_ippan',t:'mc',
 q:'食品工場《しょくひんこうじょう》の中《なか》を、清潔作業区域《せいけつさぎょうくいき》・準清潔作業区域《じゅんせいけつさぎょうくいき》・汚染作業区域《おせんさぎょうくいき》などに分《わ》けて管理《かんり》することを何《なん》というか。',
 qi:'Mengelola pabrik makanan dengan membagi area bersih, semi-bersih, dan area kontaminasi disebut apa?',
 o:['区分衛生管理《くぶんえいせいかんり》（ゾーニング）','5S','ヒヤリ・ハット'],

 a:0,
 e:'ゾーニングで区域《くいき》を分《わ》け、汚染作業区域《おせんさぎょうくいき》の人《ひと》や物《もの》が清潔作業区域《せいけつさぎょうくいき》に入《はい》らないようにする。',
 ei:'Dengan zoning, area dibagi agar orang dan barang dari area kontaminasi tidak masuk ke area bersih.'},
{id:'ei09',c:'e_ippan',t:'mc',
 q:'加熱《かねつ》や薬剤《やくざい》で殺菌《さっきん》が終《お》わった食品《しょくひん》を扱《あつか》う区域《くいき》（盛付《もりつ》け・包装《ほうそう》など）はどれか。',
 qi:'Area yang menangani makanan yang sudah disterilkan dengan panas atau bahan kimia (penataan, pengemasan, dll.) adalah?',
 o:['清潔作業区域《せいけつさぎょうくいき》','汚染作業区域《おせんさぎょうくいき》','原材料受入区域《げんざいりょううけいれくいき》'],
 oi:['Area kerja bersih','Area kerja kontaminasi','Area penerimaan bahan baku'],
 a:0,
 e:'清潔作業区域《せいけつさぎょうくいき》は殺菌後《さっきんご》の食品《しょくひん》を扱《あつか》う。準清潔作業区域《じゅんせいけつさぎょうくいき》は殺菌前《さっきんまえ》の下処理《したしょり》・加熱調理《かねつちょうり》、汚染作業区域《おせんさぎょうくいき》は原材料《げんざいりょう》の受入《うけい》れなど。',
 ei:'Area bersih menangani makanan setelah disterilkan. Area semi-bersih untuk persiapan dan memasak sebelum sterilisasi, area kontaminasi untuk penerimaan bahan baku, dll.'},
{id:'ei10',c:'e_ippan',t:'mc',
 q:'原材料《げんざいりょう》が入《はい》っていた段《だん》ボール箱《ばこ》の扱《あつか》いとして、正《ただ》しいものはどれか。',
 qi:'Manakah penanganan kardus bekas wadah bahan baku yang benar?',
 o:['準清潔作業区域《じゅんせいけつさぎょうくいき》や清潔作業区域《せいけつさぎょうくいき》に持《も》ち込《こ》まない','清潔作業区域《せいけつさぎょうくいき》にそのまま持《も》ち込《こ》む','作業台《さぎょうだい》の上《うえ》に置《お》いて使《つか》う'],
 oi:['Tidak dibawa ke area semi-bersih atau area bersih','Langsung dibawa ke area bersih','Diletakkan dan dipakai di atas meja kerja'],
 a:0,
 e:'段《だん》ボール箱《ばこ》やコンテナには、土《つち》・虫《むし》・微生物《びせいぶつ》がついていることがある。そのまま清潔《せいけつ》な区域《くいき》に持《も》ち込《こ》まない。',
 ei:'Kardus dan kontainer bisa terkena tanah, serangga, atau mikroorganisme. Jangan dibawa langsung ke area bersih.'},

// ===== 危害要因 =====
{id:'ek01',c:'e_kigai',t:'mc',
 q:'物理的危害要因《ぶつりてききがいよういん》の例《れい》として、正《ただ》しいものはどれか。',
 qi:'Manakah contoh faktor bahaya fisik yang benar?',
 o:['金属片《きんぞくへん》・ガラス片《へん》','ヒスタミン','ノロウイルス'],
 oi:['Serpihan logam, serpihan kaca','Histamin','Norovirus'],
 a:0,
 e:'金属片《きんぞくへん》・ガラス片《へん》・石《いし》・プラスチック片《へん》など、歯《は》が欠《か》けたり口《くち》の中《なか》を傷《きず》つけたりするものが物理的危害要因《ぶつりてききがいよういん》。ヒスタミンは化学的《かがくてき》、ノロウイルスは生物的危害要因《せいぶつてききがいよういん》。',
 ei:'Serpihan logam, kaca, batu, plastik, dll. yang bisa merusak gigi atau melukai mulut adalah bahaya fisik. Histamin adalah bahaya kimia, norovirus adalah bahaya biologis.'},
{id:'ek02',c:'e_kigai',t:'mc',
 q:'金属片《きんぞくへん》・ガラス片《へん》・石《いし》など、硬《かた》い異物《いぶつ》を何《なん》というか。',
 qi:'Benda asing yang keras seperti serpihan logam, kaca, dan batu disebut apa?',
 o:['硬質異物《こうしついぶつ》','軟質異物《なんしついぶつ》','アレルゲン'],
 oi:['Benda asing keras','Benda asing lunak','Alergen'],
 a:0,
 e:'硬質異物《こうしついぶつ》は人《ひと》をケガさせるおそれがあるので、混入《こんにゅう》を防《ふせ》ぐ。異物《いぶつ》を見《み》つけたら、すぐに作業《さぎょう》を止《と》めて責任者《せきにんしゃ》に報告《ほうこく》する。',
 ei:'Benda asing keras bisa melukai orang, jadi pencampurannya harus dicegah. Jika menemukan benda asing, segera hentikan pekerjaan dan laporkan ke penanggung jawab.'},
{id:'ek03',c:'e_kigai',t:'mc',
 q:'食品《しょくひん》に髪《かみ》の毛《け》や虫《むし》が入《はい》っていた。正《ただ》しい考《かんが》え方《かた》はどれか。',
 qi:'Ada rambut atau serangga di dalam makanan. Manakah cara berpikir yang benar?',
 o:['硬《かた》い異物《いぶつ》でなくても、苦情《くじょう》や返品《へんぴん》の原因《げんいん》になるので入《い》れてはいけない','硬《かた》くないので問題《もんだい》ない','取《と》り除《のぞ》かずにそのまま出荷《しゅっか》する'],
 oi:['Walaupun bukan benda keras, bisa menyebabkan keluhan dan pengembalian, jadi tidak boleh masuk','Tidak keras, jadi tidak masalah','Dikirim apa adanya tanpa dibuang'],
 a:0,
 e:'虫《むし》・髪《かみ》の毛《け》・紙片《しへん》などは口《くち》を傷《きず》つけなくても、不潔《ふけつ》な食品《しょくひん》と思《おも》われ、苦情《くじょう》（クレーム）や返品《へんぴん》になり、会社《かいしゃ》の信用《しんよう》が落《お》ちる。',
 ei:'Serangga, rambut, potongan kertas, dll., walaupun tidak melukai mulut, membuat makanan dianggap kotor dan menyebabkan keluhan atau pengembalian, sehingga kepercayaan perusahaan turun.'},
{id:'ek04',c:'e_kigai',t:'mc',
 q:'化学的危害要因《かがくてききがいよういん》の例《れい》として、正《ただ》しいものはどれか。',
 qi:'Manakah contoh faktor bahaya kimia yang benar?',
 o:['アレルギー物質《ぶっしつ》・殺菌剤《さっきんざい》などの薬剤《やくざい》','ガラス片《へん》','アニサキス'],
 oi:['Zat alergi, bahan kimia seperti disinfektan','Serpihan kaca','Anisakis'],
 a:0,
 e:'化学的危害要因《かがくてききがいよういん》は、アレルギー物質《ぶっしつ》・ヒスタミン・ソラニン・洗浄剤《せんじょうざい》や殺菌剤《さっきんざい》などの化学物質《かがくぶっしつ》。アニサキスは寄生虫《きせいちゅう》（生物的《せいぶつてき》）。',
 ei:'Bahaya kimia meliputi zat alergi, histamin, solanin, serta bahan kimia seperti pembersih dan disinfektan. Anisakis adalah parasit (biologis).'},
{id:'ek05',c:'e_kigai',t:'mc',
 q:'日本《にほん》の法律《ほうりつ》で、アレルギー物質《ぶっしつ》として表示《ひょうじ》が義務《ぎむ》になっている原材料《げんざいりょう》を何《なん》というか。',
 qi:'Menurut hukum Jepang, bahan baku alergen yang wajib dicantumkan disebut apa?',
 o:['特定原材料《とくていげんざいりょう》','特定原材料《とくていげんざいりょう》に準《じゅん》ずるもの','食品添加物《しょくひんてんかぶつ》'],
 oi:['Bahan baku tertentu (wajib)','Bahan setara bahan baku tertentu (dianjurkan)','Bahan tambahan pangan'],
 a:0,
 e:'表示《ひょうじ》義務《ぎむ》＝特定原材料《とくていげんざいりょう》（9品目《ひんもく》）、表示推奨《ひょうじすいしょう》＝特定原材料《とくていげんざいりょう》に準《じゅん》ずるもの（20品目《ひんもく》）。',
 ei:'Wajib dicantumkan = bahan baku tertentu (9 jenis); dianjurkan = bahan setara (20 jenis).'},
{id:'ek06',c:'e_kigai',t:'mc',
 q:'特定原材料《とくていげんざいりょう》（表示義務《ひょうじぎむ》）に含《ふく》まれるものはどれか。',
 qi:'Manakah yang termasuk bahan baku tertentu (wajib dicantumkan)?',
 o:['卵《たまご》','牛肉《ぎゅうにく》','りんご'],
 oi:['Telur','Daging sapi','Apel'],
 a:0,

 ei:'Bahan baku tertentu ada 9: udang, kepiting, kenari, gandum, soba, telur, susu, kacang tanah, kacang mete (mete ditambahkan April 2026). Daging sapi dan apel termasuk yang dianjurkan.'},
{id:'ek07',c:'e_kigai',t:'mc',
 q:'2026年4月1日から特定原材料《とくていげんざいりょう》（表示義務《ひょうじぎむ》）に追加《ついか》されたものはどれか。',
 qi:'Apa yang ditambahkan ke bahan baku tertentu (wajib dicantumkan) mulai 1 April 2026?',
 o:['カシューナッツ','ピスタチオ','バナナ'],
 oi:['Kacang mete','Pistachio','Pisang'],
 a:0,
 e:'カシューナッツが特定原材料《とくていげんざいりょう》に追加《ついか》され9品目《ひんもく》になった。ピスタチオは「準《じゅん》ずるもの」に追加《ついか》された。',
 ei:'Kacang mete ditambahkan ke bahan baku tertentu sehingga menjadi 9 jenis. Pistachio ditambahkan ke "bahan setara".'},
{id:'ek08',c:'e_kigai',t:'mc',
 q:'アレルギー物質《ぶっしつ》が他《ほか》の食品《しょくひん》に入《はい》らないようにする方法《ほうほう》として、正《ただ》しいものはどれか。',
 qi:'Manakah cara yang benar agar zat alergi tidak masuk ke makanan lain?',
 o:['アレルギー物質《ぶっしつ》を含《ふく》む原材料《げんざいりょう》に使《つか》った器具《きぐ》は必《かなら》ず洗浄《せんじょう》し、まな板《いた》や包丁《ほうちょう》を使《つか》い分《わ》ける','同《おな》じまな板《いた》をそのまま使《つか》う','水《みず》で少《すこ》しすすぐだけにする'],
 oi:['Selalu mencuci alat yang dipakai untuk bahan alergen dan memisahkan talenan serta pisau','Langsung memakai talenan yang sama','Hanya dibilas sedikit dengan air'],
 a:0,
 e:'たとえば、ゆで卵《たまご》を切《き》った板《いた》や包丁《ほうちょう》と、他《ほか》の原材料《げんざいりょう》を切《き》る板《いた》・包丁《ほうちょう》は別《べつ》にする。使《つか》った機械《きかい》・器具《きぐ》は必《かなら》ず洗浄《せんじょう》する。',
 ei:'Misalnya, talenan dan pisau untuk memotong telur rebus dipisah dari yang untuk bahan lain. Mesin dan alat yang dipakai wajib dicuci.'},
{id:'ek09',c:'e_kigai',t:'mc',
 q:'マグロ・サバ・イワシなどの赤身《あかみ》の魚《さかな》を悪《わる》い条件《じょうけん》で保存《ほぞん》したときに増《ふ》え、食中毒《しょくちゅうどく》の原因《げんいん》になる物質《ぶっしつ》はどれか。',
 qi:'Zat apa yang bertambah ketika ikan berdaging merah seperti tuna, makarel, dan sarden disimpan dalam kondisi buruk, dan menyebabkan keracunan?',
 o:['ヒスタミン','ソラニン','カフェイン'],
 oi:['Histamin','Solanin','Kafein'],
 a:0,
 e:'ヒスタミンは保存状態《ほぞんじょうたい》が悪《わる》いと増《ふ》え、アレルギーに似《に》た症状《しょうじょう》を起《お》こす（ヒスタミン食中毒《しょくちゅうどく》）。受入《うけい》れた魚《さかな》はすぐに冷蔵《れいぞう》・冷凍《れいとう》する。',
 ei:'Histamin bertambah jika kondisi penyimpanan buruk dan menyebabkan gejala mirip alergi (keracunan histamin). Ikan yang diterima segera didinginkan atau dibekukan.'},
{id:'ek10',c:'e_kigai',t:'mc',
 q:'じゃがいもの芽《め》や緑色《みどりいろ》の皮《かわ》に含《ふく》まれ、食中毒《しょくちゅうどく》の原因《げんいん》になる物質《ぶっしつ》はどれか。',
 qi:'Zat apa yang terkandung di tunas dan kulit hijau kentang dan menyebabkan keracunan?',
 o:['ソラニン','ヒスタミン','アニサキス'],
 oi:['Solanin','Histamin','Anisakis'],
 a:0,
 e:'ソラニンは吐《は》き気《け》・おう吐《と》・下痢《げり》・腹痛《ふくつう》などを起《お》こす。芽《め》と緑色《みどりいろ》の皮《かわ》を取《と》り除《のぞ》けば防《ふせ》げる。',
 ei:'Solanin menyebabkan mual, muntah, diare, sakit perut, dll. Dapat dicegah dengan membuang tunas dan kulit hijau.'},
{id:'ek11',c:'e_kigai',t:'mc',
 q:'生物的危害要因《せいぶつてききがいよういん》として、正《ただ》しくないものはどれか。',
 qi:'Manakah yang BUKAN faktor bahaya biologis?',
 o:['金属片《きんぞくへん》','細菌《さいきん》','寄生虫《きせいちゅう》'],
 oi:['Serpihan logam','Bakteri','Parasit'],
 a:0,
 e:'生物的危害要因《せいぶつてききがいよういん》は、細菌《さいきん》・ウイルス・寄生虫《きせいちゅう》・カビなど。金属片《きんぞくへん》は物理的危害要因《ぶつりてききがいよういん》。',
 ei:'Bahaya biologis: bakteri, virus, parasit, jamur, dll. Serpihan logam adalah bahaya fisik.'},
{id:'ek12',c:'e_kigai',t:'mc',
 q:'鶏肉《とりにく》が主《おも》な原因食品《げんいんしょくひん》で、下痢《げり》・腹痛《ふくつう》・発熱《はつねつ》を起《お》こす食中毒菌《しょくちゅうどくきん》はどれか。',
 qi:'Bakteri keracunan makanan mana yang terutama berasal dari daging ayam dan menyebabkan diare, sakit perut, dan demam?',
 o:['カンピロバクター属菌《ぞくきん》','腸炎《ちょうえん》ビブリオ','ボツリヌス菌《きん》'],
 oi:['Campylobacter','Vibrio parahaemolyticus','Clostridium botulinum'],
 a:0,
 e:'カンピロバクターは食肉《しょくにく》（特《とく》に鶏肉《とりにく》）が原因《げんいん》。腸炎《ちょうえん》ビブリオは魚介類《ぎょかいるい》、ボツリヌス菌《きん》は瓶詰《びんづ》め・レトルト食品《しょくひん》など。',
 ei:'Campylobacter berasal dari daging (terutama ayam). Vibrio parahaemolyticus dari makanan laut, botulinum dari makanan dalam botol/retort, dll.'},
{id:'ek13',c:'e_kigai',t:'mc',
 q:'人《ひと》の皮膚《ひふ》や傷口《きずぐち》にいて、熱《ねつ》に強《つよ》い毒素《どくそ》を作《つく》る食中毒菌《しょくちゅうどくきん》はどれか。',
 qi:'Bakteri keracunan mana yang ada di kulit atau luka manusia dan membuat racun tahan panas?',
 o:['黄色《おうしょく》ブドウ球菌《きゅうきん》','カンピロバクター属菌《ぞくきん》','腸管出血性大腸菌《ちょうかんしゅっけつせいだいちょうきん》'],
 oi:['Staphylococcus aureus','Campylobacter','E. coli enterohemoragik (EHEC)'],
 a:0,
 e:'黄色《おうしょく》ブドウ球菌《きゅうきん》の毒素《どくそ》は加熱《かねつ》してもなくならない。おにぎり・サンドイッチなどが原因《げんいん》になりやすい。手《て》に傷《きず》があるときは責任者《せきにんしゃ》に報告《ほうこく》する。',
 ei:'Racun Staphylococcus aureus tidak hilang walaupun dipanaskan. Onigiri, sandwich, dll. mudah menjadi penyebab. Jika ada luka di tangan, laporkan ke penanggung jawab.'},
{id:'ek14',c:'e_kigai',t:'mc',
 q:'カレーやシチューなど、大量《たいりょう》に加熱調理《かねつちょうり》した食品《しょくひん》がゆっくり冷《さ》める間《あいだ》に増《ふ》えやすい、芽胞《がほう》を作《つく》る菌《きん》はどれか。',
 qi:'Bakteri pembentuk spora mana yang mudah bertambah saat makanan yang dimasak dalam jumlah besar seperti kari atau semur mendingin perlahan?',
 o:['ウェルシュ菌《きん》','腸炎《ちょうえん》ビブリオ','カンピロバクター属菌《ぞくきん》'],
 oi:['Clostridium perfringens','Vibrio parahaemolyticus','Campylobacter'],
 a:0,
 e:'ウェルシュ菌《きん》は熱《ねつ》に強《つよ》い芽胞《がほう》を作《つく》り、加熱後《かねつご》ゆっくり温度《おんど》が下《さ》がる間《あいだ》に増《ふ》える。加熱調理後《かねつちょうりご》はすぐに冷《ひ》やすことが大切《たいせつ》。',
 ei:'Clostridium perfringens membentuk spora tahan panas dan bertambah saat suhu turun perlahan setelah dipanaskan. Penting untuk segera mendinginkan setelah dimasak.'},
{id:'ek15',c:'e_kigai',t:'mc',
 q:'食中毒予防《しょくちゅうどくよぼう》の3原則《げんそく》として、正《ただ》しいものはどれか。',
 qi:'Manakah 3 prinsip pencegahan keracunan makanan yang benar?',
 o:['つけない・増《ふ》やさない・やっつける','見《み》ない・言《い》わない・聞《き》かない','洗《あら》わない・冷《ひ》やさない・焼《や》かない'],
 oi:['Jangan menempelkan, jangan membiarkan berkembang, matikan','Jangan melihat, jangan bicara, jangan dengar','Jangan mencuci, jangan mendinginkan, jangan memanggang'],
 a:0,
 e:'食中毒菌《しょくちゅうどくきん》を「つけない」（清潔《せいけつ》・手洗《てあら》い）、「増《ふ》やさない」（低温保管《ていおんほかん》）、「やっつける」（加熱殺菌《かねつさっきん》など）。',
 ei:'Bakteri keracunan "jangan ditempelkan" (bersih, cuci tangan), "jangan dibiarkan berkembang" (simpan dingin), "dimatikan" (sterilisasi panas, dll.).'},
{id:'ek16',c:'e_kigai',t:'mc',
 q:'多《おお》くの細菌《さいきん》が特《とく》に速《はや》く増《ふ》える温度《おんど》はどれか。',
 qi:'Pada suhu berapa kebanyakan bakteri berkembang biak paling cepat?',
 o:['30〜40℃','0〜4℃','-15℃以下《いか》'],
 oi:['30–40°C','0–4°C','-15°C ke bawah'],
 a:0,
 e:'細菌《さいきん》は20〜50℃を好《この》み、特《とく》に30〜40℃で速《はや》く増《ふ》える。10℃以下《いか》では増《ふ》え方《かた》が遅《おそ》くなり、-15℃以下《いか》では増《ふ》えない。',
 ei:'Bakteri menyukai suhu 20–50°C dan berkembang paling cepat pada 30–40°C. Di bawah 10°C perkembangannya lambat, dan di bawah -15°C tidak berkembang.'},
{id:'ek17',c:'e_kigai',t:'mc',
 q:'多《おお》くの食中毒菌《しょくちゅうどくきん》を殺《ころ》すための加熱《かねつ》の目安《めやす》（中心温度《ちゅうしんおんど》）はどれか。',
 qi:'Berapa patokan pemanasan (suhu inti) untuk membunuh kebanyakan bakteri keracunan?',
 o:['75℃で1分間以上《ぷんかんいじょう》','50℃で1分間《ぷんかん》','60℃で10秒《びょう》'],
 oi:['75°C selama 1 menit atau lebih','50°C selama 1 menit','60°C selama 10 detik'],
 a:0,
 e:'一般的《いっぱんてき》な食中毒菌《しょくちゅうどくきん》は中心温度《ちゅうしんおんど》75℃で1分間以上《ぷんかんいじょう》。ノロウイルスは85〜90℃で90秒以上《びょういじょう》、セレウス菌《きん》の芽胞《がほう》は120℃で4分以上《ぷんいじょう》が必要《ひつよう》。',
 ei:'Bakteri keracunan umum: suhu inti 75°C selama 1 menit atau lebih. Norovirus: 85–90°C selama 90 detik atau lebih. Spora Bacillus cereus: 120°C selama 4 menit atau lebih.'},
{id:'ek18',c:'e_kigai',t:'mc',
 q:'ノロウイルスを加熱《かねつ》で殺《ころ》すための条件《じょうけん》（中心温度《ちゅうしんおんど》）はどれか。',
 qi:'Berapa syarat pemanasan (suhu inti) untuk membunuh norovirus?',
 o:['85〜90℃で90秒間以上《びょうかんいじょう》','60℃で1分間《ぷんかん》','40℃で10分間《ぷんかん》'],
 oi:['85–90°C selama 90 detik atau lebih','60°C selama 1 menit','40°C selama 10 menit'],
 a:0,
 e:'ノロウイルスは中心温度《ちゅうしんおんど》85〜90℃で90秒間以上《びょうかんいじょう》の加熱《かねつ》が必要《ひつよう》。アルコール消毒《しょうどく》では死《し》なないので、200ppmの次亜塩素酸《じあえんそさん》ナトリウム溶液《ようえき》などを使《つか》う。',
 ei:'Norovirus perlu dipanaskan dengan suhu inti 85–90°C selama 90 detik atau lebih. Tidak mati dengan alkohol, jadi gunakan larutan natrium hipoklorit 200 ppm, dll.'},
{id:'ek19',c:'e_kigai',t:'mc',
 q:'ノロウイルスによる食中毒《しょくちゅうどく》を防《ふせ》ぐ4原則《げんそく》のうち、食中毒予防《しょくちゅうどくよぼう》の3原則《げんそく》に加《くわ》わるものはどれか。',
 qi:'Dari 4 prinsip pencegahan keracunan norovirus, mana yang ditambahkan selain 3 prinsip umum?',
 o:['持《も》ち込《こ》まない・拡《ひろ》げない','増《ふ》やす・冷《ひ》やさない','乾《かわ》かす・凍《こお》らせる'],
 oi:['Jangan membawa masuk, jangan menyebarkan','Memperbanyak, tidak mendinginkan','Mengeringkan, membekukan'],
 a:0,
 e:'ノロウイルスは食品《しょくひん》の中《なか》で増《ふ》えないので「増《ふ》やさない」は効果《こうか》が小《ちい》さい。そこで「持《も》ち込《こ》まない・つけない・やっつける・拡《ひろ》げない」の4つが大切《たいせつ》。',
 ei:'Norovirus tidak berkembang di dalam makanan, jadi "jangan dibiarkan berkembang" kurang efektif. Karena itu penting 4 hal: jangan membawa masuk, jangan menempelkan, matikan, jangan menyebarkan.'},
{id:'ek20',c:'e_kigai',t:'mc',
 q:'サバ・イワシ・サケ・イカなどの魚介類《ぎょかいるい》に寄生《きせい》し、生《なま》で食《た》べると激《はげ》しい腹痛《ふくつう》を起《お》こす寄生虫《きせいちゅう》はどれか。',
 qi:'Parasit apa yang hidup di makanan laut seperti makarel, sarden, salmon, cumi dan menyebabkan sakit perut hebat jika dimakan mentah?',
 o:['アニサキス','カンピロバクター','ウェルシュ菌《きん》'],
 oi:['Anisakis','Campylobacter','Clostridium perfringens'],
 a:0,
 e:'アニサキスは70℃以上《いじょう》（60℃なら1分間《ぷんかん》）の加熱《かねつ》、または-20℃で24時間以上《じかんいじょう》の冷凍《れいとう》で死《し》ぬ。',
 ei:'Anisakis mati dengan pemanasan 70°C ke atas (60°C selama 1 menit), atau dibekukan -20°C selama 24 jam atau lebih.'},

// ===== 一般衛生管理 =====
{id:'eg01',c:'e_eisei',t:'mc',
 q:'5Sの「整頓《せいとん》」の意味《いみ》として、正《ただ》しいものはどれか。',
 qi:'Manakah arti "seiton" dalam 5S yang benar?',
 o:['必要《ひつよう》な物《もの》をすぐ取《と》り出《だ》せるように、決《き》めた場所《ばしょ》に置《お》く','いらない物《もの》を捨《す》てる','汚《よご》れを洗《あら》って落《お》とす'],
 oi:['Menaruh barang yang perlu di tempat yang ditentukan agar mudah diambil','Membuang barang yang tidak perlu','Mencuci dan menghilangkan kotoran'],
 a:0,
 e:'整理《せいり》＝いらない物《もの》をなくす、整頓《せいとん》＝決《き》めた場所《ばしょ》に置《お》く、清掃《せいそう》＝汚《よご》れを取《と》る、清潔《せいけつ》＝きれいな状態《じょうたい》を保《たも》つ、習慣付《しゅうかんづ》け（しつけ）＝ルールを守《まも》る。',
 ei:'Seiri = membuang yang tidak perlu, seiton = menaruh di tempat yang ditentukan, seisou = membersihkan kotoran, seiketsu = menjaga tetap bersih, shuukanzuke (shitsuke) = mematuhi aturan.'},
{id:'eg02',c:'e_eisei',t:'mc',
 q:'作業前《さぎょうまえ》の健康《けんこう》チェックで、責任者《せきにんしゃ》に必《かなら》ず報告《ほうこく》しなければならないものはどれか。',
 qi:'Pada pemeriksaan kesehatan sebelum kerja, apa yang wajib dilaporkan ke penanggung jawab?',
 o:['下痢《げり》・発熱《はつねつ》・吐《は》き気《け》や手指《てゆび》の傷《きず》','前《まえ》の日《ひ》によく眠《ねむ》れたこと','朝《あさ》ご飯《はん》を食《た》べたこと'],
 oi:['Diare, demam, mual, atau luka di jari','Tidur nyenyak semalam','Sudah sarapan'],
 a:0,
 e:'下痢《げり》・発熱《はつねつ》・吐《は》き気《け》がある人《ひと》や、手指《てゆび》に傷《きず》がある人《ひと》は、食中毒《しょくちゅうどく》の原因《げんいん》を持《も》ち込《こ》むおそれがあるので、必《かなら》ず報告《ほうこく》する。',
 ei:'Orang dengan diare, demam, mual, atau luka di jari bisa membawa penyebab keracunan, jadi wajib dilaporkan.'},
{id:'eg03',c:'e_eisei',t:'mc',
 q:'作業服《さぎょうふく》の着方《きかた》として、正《ただ》しいものはどれか。',
 qi:'Manakah cara memakai baju kerja yang benar?',
 o:['ヘアーネットを帽子《ぼうし》の内側《うちがわ》にかぶり、髪《かみ》の毛《け》を出《だ》さない','暑《あつ》いので帽子《ぼうし》を脱《ぬ》いで作業《さぎょう》する','マスクから鼻《はな》を出《だ》す'],
 oi:['Memakai jaring rambut di dalam topi dan tidak memperlihatkan rambut','Melepas topi saat bekerja karena panas','Hidung keluar dari masker'],
 a:0,
 e:'ヘアーネット→帽子《ぼうし》→作業服《さぎょうふく》の順《じゅん》に着《き》て、最後《さいご》に鏡《かがみ》で確認《かくにん》する。作業中《さぎょうちゅう》も正《ただ》しく着《き》たままにする。',
 ei:'Pakai jaring rambut → topi → baju kerja, lalu periksa di cermin. Tetap dipakai dengan benar selama bekerja.'},
{id:'eg04',c:'e_eisei',t:'mc',
 q:'作業場《さぎょうば》に入《はい》るとき、身《み》につけてはいけないものはどれか。',

 o:['指輪《ゆびわ》・腕時計《うでどけい》・ピアス','清潔《せいけつ》な作業服《さぎょうふく》','自分《じぶん》のサイズに合《あ》った手袋《てぶくろ》'],
 oi:['Cincin, jam tangan, anting','Baju kerja yang bersih','Sarung tangan sesuai ukuran'],
 a:0,
 e:'指輪《ゆびわ》・腕時計《うでどけい》・アクセサリー・ヘアピン・つけまつげ・つけ爪《づめ》などは異物混入《いぶつこんにゅう》の原因《げんいん》になるので外《はず》す。爪《つめ》は短《みじか》く切《き》る。',
 ei:'Cincin, jam tangan, aksesori, jepit rambut, bulu mata palsu, kuku palsu, dll. bisa menjadi benda asing, jadi dilepas. Kuku dipotong pendek.'},
{id:'eg05',c:'e_eisei',t:'mc',
 q:'正《ただ》しい手洗《てあら》いで、せっけんをつけて手《て》を洗《あら》う時間《じかん》の目安《めやす》はどれか。',
 qi:'Berapa patokan waktu mencuci tangan dengan sabun dalam cara cuci tangan yang benar?',
 o:['30秒間程度《びょうかんていど》','3秒間程度《びょうかんていど》','10分間程度《ぷんかんていど》'],
 oi:['Sekitar 30 detik','Sekitar 3 detik','Sekitar 10 menit'],
 a:0,
 e:'流水《りゅうすい》で汚《よご》れを落《お》とす→せっけんで指《ゆび》の間《あいだ》・指先《ゆびさき》・爪《つめ》・手首《てくび》まで約《やく》30秒《びょう》洗《あら》う→約《やく》20秒《びょう》流水《りゅうすい》で流《なが》す→ペーパータオルで乾《かわ》かす→アルコールで消毒《しょうどく》。',
 ei:'Bilas kotoran dengan air mengalir → cuci dengan sabun sela jari, ujung jari, kuku, sampai pergelangan sekitar 30 detik → bilas air mengalir sekitar 20 detik → keringkan dengan tisu → disinfeksi dengan alkohol.'},
{id:'eg06',c:'e_eisei',t:'mc',
 q:'手洗《てあら》いをしなければならない場面《ばめん》として、正《ただ》しくないものはどれか。',
 qi:'Manakah yang BUKAN situasi wajib cuci tangan?',
 o:['作業《さぎょう》が終《お》わって家《いえ》でテレビを見《み》る前《まえ》','トイレのあと','生肉《なまにく》や卵《たまご》に触《さわ》ったあと、他《ほか》の食品《しょくひん》に触《さわ》る前《まえ》'],
 oi:['Sebelum menonton TV di rumah setelah kerja','Setelah dari toilet','Setelah menyentuh daging mentah atau telur, sebelum menyentuh makanan lain'],
 a:0,
 e:'作業場《さぎょうば》に入《はい》る前《まえ》、作業開始直前《さぎょうかいしちょくぜん》、トイレのあと、生肉《なまにく》・魚《さかな》・卵《たまご》に触《さわ》ったあと、盛付《もりつ》けの前《まえ》、汚染区域《おせんくいき》から移動《いどう》したときは手洗《てあら》いをする。',
 ei:'Cuci tangan sebelum masuk area kerja, tepat sebelum mulai bekerja, setelah dari toilet, setelah menyentuh daging/ikan/telur mentah, sebelum menata makanan, dan saat pindah dari area kontaminasi.'},
{id:'eg07',c:'e_eisei',t:'mc',
 q:'使《つか》い捨《す》て手袋《てぶくろ》を交換《こうかん》しなければならない場面《ばめん》として、正《ただ》しいものはどれか。',
 qi:'Kapan sarung tangan sekali pakai harus diganti?',
 o:['肉《にく》を調理《ちょうり》したあと、野菜《やさい》の調理《ちょうり》を始《はじ》めるとき','同《おな》じ作業《さぎょう》を続《つづ》けるとき','手袋《てぶくろ》がきれいなとき'],
 oi:['Saat mulai memasak sayur setelah memasak daging','Saat melanjutkan pekerjaan yang sama','Saat sarung tangan masih bersih'],
 a:0,
 e:'扱《あつか》う原材料《げんざいりょう》が変《か》わるとき、段《だん》ボールに触《さわ》ったあと、トイレや休憩《きゅうけい》のあと、手袋《てぶくろ》が破《やぶ》れたときなどは交換《こうかん》する。',
 ei:'Ganti saat jenis bahan berubah, setelah menyentuh kardus, setelah dari toilet atau istirahat, saat sarung tangan sobek, dll.'},
{id:'eg08',c:'e_eisei',t:'mc',
 q:'作業場《さぎょうば》に持《も》ち込《こ》んではいけないものとして、正《ただ》しいものはどれか。',
 qi:'Manakah barang yang tidak boleh dibawa ke area kerja?',
 o:['ホチキスの針《はり》がついた書類《しょるい》やシャープペン','作業手順書《さぎょうてじゅんしょ》で決《き》められた道具《どうぐ》','清潔《せいけつ》な作業服《さぎょうふく》'],
 oi:['Dokumen dengan staples atau pensil mekanik','Alat yang ditentukan dalam prosedur kerja','Baju kerja yang bersih'],
 a:0,
 e:'ホチキスの針《はり》・クリップ・鉛筆《えんぴつ》やシャープペンの芯《しん》は異物《いぶつ》の原因《げんいん》になる。スマートフォン・財布《さいふ》・たばこなども持《も》ち込《こ》まない。',
 ei:'Staples, klip, isi pensil atau pensil mekanik bisa menjadi benda asing. Ponsel, dompet, rokok, dll. juga tidak dibawa masuk.'},
{id:'eg09',c:'e_eisei',t:'mc',
 q:'食品衛生法《しょくひんえいせいほう》で決《き》められている冷蔵庫《れいぞうこ》の温度《おんど》はどれか。',
 qi:'Berapa suhu lemari pendingin yang ditetapkan UU Kebersihan Pangan?',
 o:['10℃以下《いか》','20℃以下《いか》','30℃以下《いか》'],
 oi:['10°C ke bawah','20°C ke bawah','30°C ke bawah'],
 a:0,
 e:'食品衛生法《しょくひんえいせいほう》では冷蔵庫《れいぞうこ》は10℃以下《いか》、冷凍庫《れいとうこ》は-15℃以下《いか》。毎日《まいにち》温度《おんど》を測《はか》って記録《きろく》する。',
 ei:'Menurut UU Kebersihan Pangan, lemari pendingin 10°C ke bawah dan freezer -15°C ke bawah. Suhu diukur dan dicatat setiap hari.'},
{id:'eg10',c:'e_eisei',t:'mc',
 q:'生鮮魚介類《せいせんぎょかいるい》の保管温度《ほかんおんど》の目安《めやす》はどれか。',
 qi:'Berapa patokan suhu penyimpanan makanan laut segar?',
 o:['5℃以下《いか》','15℃以下《いか》','室温《しつおん》'],
 oi:['5°C ke bawah','15°C ke bawah','Suhu ruangan'],
 a:0,
 e:'生鮮魚介類《せいせんぎょかいるい》は5℃以下《いか》、食肉《しょくにく》は10℃以下《いか》、冷凍食品《れいとうしょくひん》・冷凍水産物《れいとうすいさんぶつ》は-18℃以下《いか》が目安《めやす》。',

{id:'eg11',c:'e_eisei',t:'mc',
 q:'冷蔵庫《れいぞうこ》に原材料《げんざいりょう》を入《い》れるときの方法《ほうほう》として、正《ただ》しいものはどれか。',
 qi:'Manakah cara memasukkan bahan baku ke lemari pendingin yang benar?',

{id:'eg12',c:'e_eisei',t:'mc',

{id:'eg13',c:'e_eisei',t:'mc',

{id:'eg15',c:'e_eisei',t:'mc',

{id:'eg16',c:'e_eisei',t:'mc',

{id:'an11',c:'anzen',t:'mc',

{id:'an12',c:'anzen',t:'mc',

{id:'an13',c:'anzen',t:'mc',
 q:'作業《さぎょう》の前《まえ》に、どこにどんな危険《きけん》が隠《かく》れているかを考《かんが》え、防《ふせ》ぐ方法《ほうほう》を話《はな》し合《あ》う訓練《くんれん》を何《なん》というか。',

{id:'an14',c:'anzen',t:'mc',
 q:'作業場《さぎょうば》での基本的《きほんてき》なルールとして、正《ただ》しいものはどれか。',
 qi:'Manakah aturan dasar di tempat kerja yang benar?',
 o:['作業場《さぎょうば》の中《なか》では走《はし》らない','コンベアの下《した》をくぐって近道《ちかみち》する','職場《しょくば》を離《はな》れるとき、誰《だれ》にも言《い》わない'],
 oi:['Tidak berlari di area kerja','Mengambil jalan pintas dengan merunduk di bawah konveyor','Tidak memberi tahu siapa pun saat meninggalkan tempat kerja'],
 a:0,
 e:'作業場《さぎょうば》では走《はし》らない、決《き》められた通路《つうろ》を歩《ある》く、コンベアの下《した》をくぐらない、職場《しょくば》を離《はな》れるときは責任者《せきにんしゃ》に声《こえ》をかける。',

{id:'an15',c:'anzen',t:'mc',
 q:'機械《きかい》のスイッチを入《い》れる前《まえ》などに、対象《たいしょう》を指《ゆび》でさして、名前《なまえ》や状態《じょうたい》を声《こえ》に出《だ》して確認《かくにん》することを何《なん》というか。',
 qi:'Memeriksa dengan menunjuk objek dan mengucapkan nama serta keadaannya dengan suara, misalnya sebelum menyalakan mesin, disebut apa?',

{id:'an16',c:'anzen',t:'mc',
 q:'重《おも》い物《もの》を持《も》ち上《あ》げるときの正《ただ》しい方法《ほうほう》はどれか。',
 qi:'Manakah cara yang benar mengangkat barang berat?',
 o:['物《もの》を体《からだ》に近《ちか》づけ、膝《ひざ》を曲《ま》げて腰《こし》を下《お》ろしてから、膝《ひざ》を伸《の》ばして立《た》ち上《あ》がる','膝《ひざ》を伸《の》ばしたまま、腰《こし》を曲《ま》げて持《も》ち上《あ》げる','体《からだ》から遠《とお》いところで持《も》ち上《あ》げる'],
 oi:['Dekatkan barang ke tubuh, tekuk lutut dan turunkan pinggang, lalu berdiri dengan meluruskan lutut','Mengangkat dengan membungkukkan pinggang dan lutut lurus','Mengangkat jauh dari tubuh'],
 a:0,
 e:'腰痛《ようつう》を防《ふせ》ぐため、物《もの》を体《からだ》に近《ちか》づけ、膝《ひざ》を使《つか》って持《も》ち上《あ》げる。重《おも》い物《もの》を運《はこ》ぶときは、できるだけ台車《だいしゃ》を使《つか》う。',

{id:'an17',c:'anzen',t:'mc',
 q:'労働災害《ろうどうさいがい》でケガをして倒《たお》れている人《ひと》を見《み》つけた。最初《さいしょ》の行動《こうどう》として、正《ただ》しいものはどれか。',
 qi:'Anda menemukan orang yang terluka dan tergeletak akibat kecelakaan kerja. Manakah tindakan pertama yang benar?',
 o:['あわてて近《ちか》づかず、何《なに》が起《お》きたか確認《かくにん》して、大《おお》きな声《こえ》で周《まわ》りに知《し》らせる','すぐに走《はし》って近《ちか》づき、一人《ひとり》で助《たす》ける','見《み》なかったことにする'],
 oi:['Tidak buru-buru mendekat, memeriksa apa yang terjadi, dan memberi tahu sekitar dengan suara keras','Segera berlari mendekat dan menolong sendiri','Pura-pura tidak melihat'],
 a:0,
 e:'あわてて近《ちか》づくと、助《たす》ける人《ひと》も災害《さいがい》にあうことがある（二次災害《にじさいがい》）。確認《かくにん》→大声《おおごえ》で知《し》らせる→必要《ひつよう》なら機械《きかい》を止《と》める→責任者《せきにんしゃ》の指示《しじ》に従《したが》う。',
 ei:'Jika mendekat dengan panik, penolong pun bisa celaka (kecelakaan sekunder). Periksa → beri tahu dengan suara keras → hentikan mesin bila perlu → ikuti instruksi penanggung jawab.'},
{id:'an18',c:'anzen',t:'mc',
 q:'熱中症《ねっちゅうしょう》の症状《しょうじょう》が出《で》た人《ひと》への対応《たいおう》として、正《ただ》しいものはどれか。',
 qi:'Manakah penanganan yang benar untuk orang dengan gejala sengatan panas?',
 o:['涼《すず》しい場所《ばしょ》で休《やす》ませ、首《くび》・脇《わき》の下《した》・足《あし》の付《つ》け根《ね》を冷《ひ》やし、塩分《えんぶん》を含《ふく》む水《みず》を飲《の》ませる','暑《あつ》い場所《ばしょ》で作業《さぎょう》を続《つづ》けさせる','水分《すいぶん》をとらせない'],
 oi:['Istirahatkan di tempat sejuk, dinginkan leher, ketiak, dan pangkal paha, beri minum air yang mengandung garam','Menyuruh tetap bekerja di tempat panas','Tidak memberi minum'],
 a:0,
 e:'①責任者《せきにんしゃ》に知《し》らせる②涼《すず》しい場所《ばしょ》へ移動《いどう》③安静《あんせい》④作業服《さぎょうふく》をゆるめ、首《くび》・脇《わき》の下《した》・足《あし》の付《つ》け根《ね》を冷《ひ》やす⑤塩分《えんぶん》を含《ふく》む水《みず》やスポーツドリンクを飲《の》ませる。',
 ei:'(1) Beri tahu penanggung jawab (2) pindahkan ke tempat sejuk (3) istirahat (4) longgarkan baju kerja, dinginkan leher, ketiak, pangkal paha (5) beri air mengandung garam atau minuman isotonik.'},

{id:'jh01',c:'j_hantei',t:'mc',
 q:'作業前《さぎょうまえ》に鏡《かがみ》で服装《ふくそう》を確認《かくにん》した。次《つぎ》のうち、正《ただ》しい状態《じょうたい》はどれか。',
 qi:'Sebelum bekerja Anda memeriksa pakaian di cermin. Manakah keadaan yang benar?',

 oi:['Masker menutupi dari hidung sampai dagu dan rambut tidak keluar dari topi','Hidung keluar dari masker','Telinga dan rambut keluar dari topi'],

{id:'jh02',c:'j_hantei',t:'mc',
 q:'作業中《さぎょうちゅう》に指《ゆび》を切《き》ってしまった。正《ただ》しい対応《たいおう》はどれか。',
 qi:'Saat bekerja jari Anda teriris. Manakah tindakan yang benar?',
 o:['すぐに作業《さぎょう》を止《と》めて、責任者《せきにんしゃ》に報告《ほうこく》する','手袋《てぶくろ》をしているので、そのまま作業《さぎょう》を続《つづ》ける','傷《きず》を水《みず》で洗《あら》って、黙《だま》って作業《さぎょう》を続《つづ》ける'],
 oi:['Segera hentikan pekerjaan dan lapor ke penanggung jawab','Lanjut bekerja karena memakai sarung tangan','Mencuci luka dengan air lalu diam-diam lanjut bekerja'],

{id:'jh03',c:'j_hantei',t:'mc',
 q:'冷蔵庫《れいぞうこ》の温度《おんど》を確認《かくにん》したら12℃だった（基準《きじゅん》は10℃以下《いか》）。正《ただ》しい対応《たいおう》はどれか。',
 qi:'Saat memeriksa suhu lemari pendingin, suhunya 12°C (standar 10°C ke bawah). Manakah tindakan yang benar?',
 o:['すぐに責任者《せきにんしゃ》に報告《ほうこく》し、記録《きろく》にも事実《じじつ》を書《か》く','記録《きろく》には10℃と書《か》いておく','少《すこ》しの差《さ》なので何《なに》もしない'],
 oi:['Segera lapor ke penanggung jawab dan tulis fakta di catatan','Menulis 10°C di catatan','Tidak melakukan apa-apa karena bedanya sedikit'],
 a:0,

{id:'jh04',c:'j_hantei',t:'mc',
 q:'金属探知機《きんぞくたんちき》にテストピースを通《とお》したが、反応《はんのう》しなかった。正《ただ》しい対応《たいおう》はどれか。',
 qi:'Test piece dilewatkan ke detektor logam, tetapi tidak bereaksi. Manakah tindakan yang benar?',
 o:['すぐに責任者《せきにんしゃ》に報告《ほうこく》する（前回《ぜんかい》の確認後《かくにんご》の製品《せいひん》は確認《かくにん》が必要《ひつよう》）','そのまま検査《けんさ》を続《つづ》ける','テストピースを捨《す》てる'],
 oi:['Segera lapor ke penanggung jawab (produk sejak pemeriksaan terakhir perlu diperiksa)','Melanjutkan pemeriksaan','Membuang test piece'],
 a:0,
 e:'金属探知機《きんぞくたんちき》が正常《せいじょう》でない可能性《かのうせい》がある。正常《せいじょう》に動《うご》いていたと確認《かくにん》した後《あと》に作《つく》った製品《せいひん》には、金属《きんぞく》が入《はい》っているかもしれない。',
 ei:'Detektor logam mungkin tidak normal. Produk yang dibuat setelah pemeriksaan normal terakhir mungkin mengandung logam.'},
{id:'jh05',c:'j_hantei',t:'mc',
 q:'受入《うけい》れた原材料《げんざいりょう》の箱《はこ》を見《み》たら、消費期限《しょうひきげん》が昨日《きのう》までだった。正《ただ》しい対応《たいおう》はどれか。',
 qi:'Saat melihat kotak bahan baku yang diterima, batas aman konsumsinya sampai kemarin. Manakah tindakan yang benar?',
 o:['受《う》け入《い》れずに、責任者《せきにんしゃ》に報告《ほうこく》する','1日だけなので使《つか》う','期限《きげん》のラベルをはがして使《つか》う'],
 oi:['Tidak diterima dan lapor ke penanggung jawab','Dipakai karena hanya lewat 1 hari','Melepas label tanggal lalu dipakai'],
 a:0,
 e:'消費期限《しょうひきげん》を過《す》ぎた原材料《げんざいりょう》は食中毒《しょくちゅうどく》の原因《げんいん》になる可能性《かのうせい》が高《たか》いので、絶対《ぜったい》に使《つか》わない。受《う》け入《い》れず、返品《へんぴん》・交換《こうかん》する。',
 ei:'Bahan yang melewati batas aman konsumsi berisiko tinggi menyebabkan keracunan, jadi sama sekali tidak dipakai. Tidak diterima; dikembalikan atau ditukar.'},
{id:'jh06',c:'j_hantei',t:'mc',
 q:'ゆで卵《たまご》を切《き》った包丁《ほうちょう》とまな板《いた》で、次《つぎ》にきゅうりを切《き》る予定《よてい》だ。正《ただ》しい対応《たいおう》はどれか。',
 qi:'Anda berencana memotong mentimun dengan pisau dan talenan bekas memotong telur rebus. Manakah tindakan yang benar?',
 o:['別《べつ》の包丁《ほうちょう》とまな板《いた》を使《つか》う（または十分《じゅうぶん》に洗浄《せんじょう》する）','そのまま使《つか》う','ふきんで軽《かる》くふいて使《つか》う'],
 oi:['Memakai pisau dan talenan lain (atau dicuci dengan benar)','Langsung dipakai','Dilap ringan dengan kain lalu dipakai'],
 a:0,
 e:'卵《たまご》のアレルギー物質《ぶっしつ》が、きゅうりに移《うつ》るのを防《ふせ》ぐ。原材料《げんざいりょう》ごとに器具《きぐ》を使《つか》い分《わ》ける。',

{id:'jh07',c:'j_hantei',t:'mc',
 q:'加熱《かねつ》したハンバーグの中心温度《ちゅうしんおんど》を測《はか》ったら70℃だった（管理基準《かんりきじゅん》は75℃で1分間以上《ぷんかんいじょう》）。正《ただ》しい対応《たいおう》はどれか。',

 oi:['Ini penyimpangan, jadi segera lapor ke penanggung jawab dan ikuti instruksinya','Dikirim karena hanya sedikit rendah','Menulis 75°C di catatan'],
 a:0,
 e:'管理基準《かんりきじゅん》を守《まも》れていないので逸脱《いつだつ》。責任者《せきにんしゃ》に報告《ほうこく》し、改善措置《かいぜんそち》（加熱《かねつ》し直《なお》す・廃棄《はいき》など）をとる。',

{id:'jh08',c:'j_hantei',t:'mc',

{id:'jh09',c:'j_hantei',t:'mc',

{id:'jh10',c:'j_hantei',t:'mc',

{id:'jh12',c:'j_hantei',t:'mc',

{id:'jk01',c:'j_keikaku',t:'mc',
 q:'濃度《のうど》6%の次亜塩素酸《じあえんそさん》ナトリウム溶液《ようえき》がある。これを薄《うす》めて200ppmの溶液《ようえき》を3L作《つく》るとき、6%の溶液《ようえき》と水《みず》はそれぞれ何mL必要《ひつよう》か。',

 oi:['Larutan 10 mL, air 2990 mL','Larutan 20 mL, air 2980 mL','Larutan 100 mL, air 2900 mL'],

const PW_HASH = 'b48c3ee69c2c33f864d6fa2cd53ca5ac83bd8956197986c961e6c222359339f8';
// ===== パスワード確認（SHA-256）=====
// パスワードそのものは保存せず、ハッシュ値（元に戻せない値）だけを比べる
function sha256Hex(str) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = Array.from(new TextEncoder().encode(str));
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(Math.floor(bitLen / Math.pow(2, i * 8)) & 0xff);
  let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < bytes.length; off += 64) {
    const w = new Array(64);
    for (let i = 0; i < 16; i++) w[i] = (bytes[off+i*4] << 24) | (bytes[off+i*4+1] << 16) | (bytes[off+i*4+2] << 8) | bytes[off+i*4+3];
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i-15], 7) ^ rotr(w[i-15], 18) ^ (w[i-15] >>> 3);
      const s1 = rotr(w[i-2], 17) ^ rotr(w[i-2], 19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (hh + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h = [h[0]+a, h[1]+b, h[2]+c, h[3]+d, h[4]+e, h[5]+f, h[6]+g, h[7]+hh].map(x => x | 0);
  }
  return h.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

function checkPassword(input) { return sha256Hex(PW_SALT + input) === PW_HASH; }

const RUBY_RE = /([一-鿿々ヶ]+)《([^》]+)》/g;
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function R(t) {   // ふりがな付きの日本語

function plain(t) { return String(t || '').replace(RUBY_RE, '$1'); }

function loadVoices() {
  if (!HAS_TTS) return;

function speak(text, rate) {

  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(RUBY_RE, '$2')); // 漢字は読みで読ませる
  u.lang = 'ja-JP';

}

function record(q, ok) {
  const now = Date.now();
  const r = DB.srs[q.id] || { box: 0, due: 0, ok: 0, ng: 0 };
  if (ok) {
    r.ok++;
    r.box = r.box === 0 ? 2 : Math.min(r.box + 1, 5);
    r.due = now + INTERVAL_DAYS[r.box] * DAY;
  } else {
    r.ng++;
    r.box = 1;
    r.due = now;           // まちがえた問題はすぐ「復習」に入る
  }
  DB.srs[q.id] = r;
  save();
}
function dueList() {
  const now = Date.now();
  return Object.entries(DB.srs)
    .filter(([id, r]) => QMAP[id] && r.due <= now)
    .sort((a, b) => a[1].box - b[1].box || a[1].due - b[1].due)
    .map(([id]) => QMAP[id]);
}
function catStats(c) {
  let ok = 0, ng = 0, seen = 0, mastered = 0, total = 0;
  QUESTIONS.forEach(q => {
    if (c && q.c !== c) return;
    total++;
    const r = DB.srs[q.id];
    if (r) { ok += r.ok; ng += r.ng; seen++; if (r.box >= 4) mastered++; }
  });
  return { ok, ng, seen, mastered, total, pct: ok + ng ? Math.round(ok / (ok + ng) * 100) : null };
}

function makeSession(mode, qs, title, limitMin) {
  return {
    mode, title, finished: false,
    items: qs.map(q => ({ q, order: q.t === 'tf' ? [0, 1] : shuffle(q.o.map((_, i) => i)), pick: null, done: false })),
    idx: 0, startedAt: Date.now(), limit: limitMin ? limitMin * 60 * 1000 : 0,
  };
}
function startPractice() {
  let pool = QUESTIONS.filter(q => srcOk(q, SETUP.src) && (SETUP.cat === 'all' || q.c === SETUP.cat));
  if (!pool.length) { toast('この条件の問題はありません'); return; }
  pool = shuffle(pool);
  if (SETUP.prio) {
    const key = q => { const r = DB.srs[q.id]; return r ? (r.box <= 1 ? 1 : r.box + 1) : 0; }; // 未学習→苦手→その他
    pool.sort((a, b) => key(a) - key(b));
  }
  const n = SETUP.n || pool.length;
  const qs = shuffle(pool.slice(0, n));
  S = makeSession('practice', qs, SETUP.cat === 'all' ? 'すべて' : plain(CATS[SETUP.cat].ja));
  VIEW = 'quiz'; render(); window.scrollTo(0, 0); autoPlay();
}
function startReview() {
  const qs = dueList().slice(0, 30);
  if (!qs.length) return;
  S = makeSession('review', shuffle(qs), '復習');
  VIEW = 'quiz'; render(); window.scrollTo(0, 0); autoPlay();
}
function startMock(type) {

  // 本番と同じ順番：分野ごとにまとめて出題
  const qs = [];
  Object.entries(M.plan).forEach(([c, n]) => qs.push(...shuffle(QUESTIONS.filter(q => q.c === c)).slice(0, n)));
  S = makeSession('mock', qs, '模擬試験（' + M.short + '）', M.minutes);
  S.mockType = type;
  VIEW = 'quiz'; render(); window.scrollTo(0, 0); startTimer();
}

// ---------- タイマー ----------
function startTimer() {
  endTimer();
  timerId = setInterval(() => {
    if (!S || S.mode !== 'mock') return endTimer();
    const left = S.limit - (Date.now() - S.startedAt);
    const el = document.getElementById('timer');
    if (el) { el.textContent = '⏱ ' + fmtTime(left); el.classList.toggle('low', left < 5 * 60 * 1000); }
    if (left <= 0) { endTimer(); toast('時間です / Waktu habis'); finish(); }
  }, 1000);
}
function endTimer() { if (timerId) clearInterval(timerId); timerId = null; }
function fmtTime(ms) { ms = Math.max(0, ms); const m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000); return m + ':' + String(s).padStart(2, '0'); }

// ---------- 解答画面 ----------
function viewQuiz() {
  if (!S) return viewHome();
  const it = S.items[S.idx], q = it.q, total = S.items.length;
  const isMock = S.mode === 'mock';
  const showFb = !isMock && it.done;
  const typeLabel = (q.t === 'tf' ? '○×' : q.t === 'listen' ? '🎧 聴解' : (q.o.length + '択')) + (q.src && SRC_INFO[q.src] ? '・' + plain(SRC_INFO[q.src][0]) : '');

  let head = `
  <div class="qbar">
    <button class="close" onclick="go('home')">✕ ${R('やめる')}</button>
    <div><b>${S.idx + 1}</b> / ${total}</div>
    ${isMock ? `<div class="timer" id="timer">⏱ ${fmtTime(S.limit - (Date.now() - S.startedAt))}</div>` : `<div class="sub">${esc(S.title)}</div>`}
  </div>
  <div class="progress"><i style="width:${(S.idx + (it.done ? 1 : 0)) / total * 100}%"></i></div>`;

  let listen = '';
  if (q.t === 'listen') {
    listen = `
    ${!HAS_TTS || (HAS_TTS && speechSynthesis.getVoices().length && !jaVoice) ? `<div class="warn">⚠️ ${R('この端末《たんまつ》では日本語《にほんご》の音声《おんせい》が使《つか》えない可能性《かのうせい》があります。')}</div>` : ''}
    <div class="listen">
      <button class="main" onclick="speak(S.items[S.idx].q.s, 0.9)">▶ ${R('聞《き》く')}</button>
      <button onclick="speak(S.items[S.idx].q.s, 0.65)">🐢 ${R('ゆっくり')}</button>
    </div>`;
  }

  let opts;
  if (q.t === 'tf') {
    const lab = [['○', '正《ただ》しい', 'Benar'], ['×', 'まちがい', 'Salah']];
    opts = `<div class="tf">${[0, 1].map(i => {
      const cls = optClass(it, i, showFb, isMock);
      return `<button class="opt ${cls}" ${showFb ? 'disabled' : ''} onclick="pick(${i})">
        <span class="mark">${lab[i][0]}</span><span class="lbl">${R(lab[i][1])}<small>${lab[i][2]}</small></span></button>`;
    }).join('')}</div>`;
  } else {
    opts = `<div class="opts">${it.order.map((oi, pos) => {
      const cls = optClass(it, oi, showFb, isMock);
      return `<button class="opt ${cls}" ${showFb ? 'disabled' : ''} onclick="pick(${oi})">
        <span class="no">${NUMS[pos]}</span><span>${R(q.o[oi])}${q.oimg ? `<img class="oimg" src="${q.oimg[oi]}" alt="">` : ''}${DB.set.furi && q.or && q.or[oi] ? `<span class="yomi">${esc(q.or[oi])}</span>` : ''}${ID(q.oi && q.oi[oi])}</span></button>`;
    }).join('')}</div>`;
  }

  let fb = '';
  if (showFb) {
    const ok = it.pick === q.a;
    const ansText = q.t === 'tf' ? (q.a === 0 ? '○ 正《ただ》しい' : '× まちがい') : q.o[q.a];
    fb = `
    <div class="fb ${ok ? 'ok' : 'ng'}">
      <div class="res">${ok ? '⭕ ' + R('正解《せいかい》！') + ' Jawaban benar!' : '❌ ' + R('不正解《ふせいかい》') + ' Jawaban salah'}</div>
      ${ok ? '' : `<div class="ans">${R('正解《せいかい》')}：${R(ansText)}${q.oimg ? `<img class="ansimg" src="${q.oimg[q.a]}" alt="">` : ''}</div>`}
      ${explain(q)}
      ${q.t === 'listen' ? scriptBox(q) : ''}
    </div>`;
  }

  let foot;
  if (isMock) {
    const unans = S.items.filter(x => x.pick === null).length;
    const last = S.idx === total - 1;
    foot = `
    <div class="qfoot">
      <button class="btn sec" ${S.idx === 0 ? 'disabled' : ''} onclick="move(-1)">← ${R('前《まえ》')}</button>
      ${last ? `<button class="btn" onclick="submitMock()">${R('提出《ていしゅつ》する')}</button>`
             : `<button class="btn" onclick="move(1)">${R('次《つぎ》')} →</button>`}
    </div>
    <div class="unans">${R('未回答《みかいとう》')}：${unans}問 / Belum dijawab</div>
    <div class="grid">${S.items.map((x, i) =>
      `<button class="${x.pick !== null ? 'done' : ''} ${i === S.idx ? 'cur' : ''}" onclick="jump(${i})">${i + 1}</button>`).join('')}</div>`;
  } else {
    foot = `<div class="qfoot"><button class="btn" ${it.done ? '' : 'disabled'} onclick="next()">
      ${S.idx === total - 1 ? R('結果《けっか》を見《み》る') : R('次《つぎ》へ') + ' →'}</button></div>`;
  }

  return `${head}
  <div class="card">
    <span class="badge">${CATS[q.c].ic} ${catName(q.c)}</span><span class="qtype">${typeLabel}</span>
    ${listen}
    ${q.p ? `<div class="passage">${R(q.p)}</div>${ID(q.pi)}` : ''}
    <div class="qtext">${R(q.q)}${DB.set.furi && q.qr ? `<span class="yomi">${esc(q.qr)}</span>` : ''}</div>${ID(q.qi)}${q.img ? `<img class="qimg" src="${q.img}" alt="">` : ''}
    ${opts}
    ${fb}
  </div>
  ${foot}`;
}
function scriptBox(q) {
  return `<div class="script">🎧 ${R(q.s)}<button onclick="speak(QMAP['${q.id}'].s,0.9)">▶</button>${ID(q.si)}</div>`;
}
function optClass(it, i, showFb, isMock) {
  if (showFb) {
    if (i === it.q.a) return 'ok';
    if (i === it.pick) return 'ng';
    return '';
  }
  return it.pick === i ? 'sel' : '';
}
function pick(i) {
  if (Date.now() - shownAt < 350) return;   // 画面が変わった直後の誤タップを無視
  const it = S.items[S.idx];
  if (S.mode === 'mock') { it.pick = i; render(); return; }
  if (it.done) return;
  it.pick = i; it.done = true;
  record(it.q, i === it.q.a);
  render();
  const fb = document.querySelector('.fb');
  if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function next() {
  stopSpeak();
  if (S.idx < S.items.length - 1) { S.idx++; render(); window.scrollTo(0, 0); autoPlay(); }
  else finish();
}
function move(d) { stopSpeak(); S.idx = Math.max(0, Math.min(S.items.length - 1, S.idx + d)); render(); window.scrollTo(0, 0); autoPlay(); }
function jump(i) { stopSpeak(); S.idx = i; render(); window.scrollTo(0, 0); autoPlay(); }
function autoPlay() {
  const it = S && S.items[S.idx];
  if (it && it.q.t === 'listen' && !it.done && it.pick === null) setTimeout(() => speak(it.q.s, 0.9), 400);
}
function submitMock() {
  const unans = S.items.filter(x => x.pick === null).length;
  const msg = unans ? `未回答が ${unans}問 あります。提出しますか？\n(Masih ada ${unans} soal belum dijawab. Kumpulkan?)` : '提出しますか？ (Kumpulkan?)';
  if (confirm(msg)) finish();
}

// ---------- 結果 ----------
function finish() {
  endTimer(); stopSpeak();
  if (S.mode === 'mock') S.items.forEach(it => { it.done = true; record(it.q, it.pick === it.q.a); });
  S.finished = true;
  const items = S.items.filter(it => it.done);
  const correct = items.filter(it => it.pick === it.q.a).length;
  const byCat = {};
  items.forEach(it => {
    const b = byCat[it.q.c] = byCat[it.q.c] || { ok: 0, n: 0 };
    b.n++; if (it.pick === it.q.a) b.ok++;
  });
  const pct = items.length ? Math.round(correct / items.length * 100) : 0;
  const score = items.reduce((a, it) => a + (it.pick === it.q.a ? pts(it.q.c) : 0), 0);
  const maxScore = items.reduce((a, it) => a + pts(it.q.c), 0);
  RESULT = { mode: S.mode, mockType: S.mockType, title: S.title, correct, total: items.length, pct, score, maxScore, byCat,
             wrong: items.filter(it => it.pick !== it.q.a), used: Date.now() - S.startedAt };
  if (S.mode === 'mock') {
    DB.hist.push({ d: Date.now(), type: S.mockType, pct, correct, total: items.length, pts: score, max: maxScore });
    if (DB.hist.length > 30) DB.hist.shift();
    save();
  }
  S = null; VIEW = 'result'; render(); window.scrollTo(0, 0);
}
function viewResult() {
  const r = RESULT; if (!r) return viewHome();
  const isMock = r.mode === 'mock';
  const M = MOCKS[r.mockType] || MOCKS.main;
  const bars = Object.keys(CATS).filter(c => r.byCat[c]).map(c => {
    const b = r.byCat[c], p = Math.round(b.ok / b.n * 100);
    return `<div class="bar-row"><span>${CATS[c].ic} ${catName(c)}</span>
      <div class="bar"><i class="${p >= 80 ? 'good' : p < PASS_LINE ? 'weak' : ''}" style="width:${p}%"></i></div>
      <span class="pct">${b.ok}/${b.n}</span></div>`;
  }).join('');
  const wrong = r.wrong.map(it => {
    const q = it.q;
    const your = it.pick === null ? '（未回答《みかいとう》）' : q.t === 'tf' ? (it.pick === 0 ? '○' : '×') : q.o[it.pick];
    const ans = q.t === 'tf' ? (q.a === 0 ? '○ 正《ただ》しい' : '× まちがい') : q.o[q.a];
    return `<details class="wrong"><summary>${CATS[q.c].ic} ${R(q.q)}</summary>
      <div class="body">
        ${q.p ? `<div class="passage">${R(q.p)}</div>` : ''}
        ${q.img ? `<img class="ansimg" src="${q.img}" alt="">` : ''}
        <div>❌ ${R('あなたの答《こた》え')}：${R(your)}${q.oimg && it.pick !== null ? `<img class="ansimg" src="${q.oimg[it.pick]}" alt="">` : ''}</div>
        <div><b>⭕ ${R('正解《せいかい》')}：${R(ans)}</b>${q.oimg ? `<img class="ansimg" src="${q.oimg[q.a]}" alt="">` : ''}</div>
        ${explain(q)}
        ${q.t === 'listen' ? `<div class="mt">🎧 ${R(q.s)} <button class="chip" style="padding:2px 10px" onclick="speak(QMAP['${q.id}'].s,0.9)">▶</button></div>${ID(q.si)}` : ''}
      </div></details>`;
  }).join('');
  return `
  <div class="card">
    <div class="score">
      <div class="sub">${isMock ? R('模擬試験《もぎしけん》の結果《けっか》') : R('練習《れんしゅう》の結果《けっか》')} / Hasil</div>
      ${isMock ? `<div class="big">${r.score}<small>/${r.maxScore}${R('点《てん》')}</small></div>` : `<div class="big">${r.pct}<small>%</small></div>`}
      <div>${r.correct} / ${r.total} ${R('問《もん》正解《せいかい》')}</div>
      ${isMock ? `<div class="pass ${r.score >= M.passPts ? 'y' : 'n'}">${r.score >= M.passPts ? '🎉 ' + R('合格《ごうかく》ライン') + ' (' + M.passPts + R('点《てん》') + ')' : '💪 ' + R('あと') + (M.passPts - r.score) + R('点《てん》') + ' (' + R('合格《ごうかく》') + ' ' + M.passPts + R('点《てん》') + ')'}</div>
                 <div class="sub mt">${R('食品衛生《しょくひんえいせい》（学科《がっか》）は1問《もん》3点《てん》、ほかは1問《もん》5点《てん》')}</div>
                 <div class="sub mt">${R(M.ja)}　${R('時間《じかん》')}：${fmtTime(r.used)} / ${M.minutes}:00</div>
` : ''}
    </div>
  </div>
  ${bars ? `<div class="card"><h2>${R('分野別《ぶんやべつ》')} <span class="sub">Per bidang</span></h2>${bars}</div>` : ''}
  ${r.wrong.length ? `
  <button class="btn" onclick="retryWrong()">${R('まちがえた問題《もんだい》をもう一度《いちど》')}（${r.wrong.length}問）<small>Ulangi soal yang salah</small></button>
  <div class="card mt"><h2>${R('まちがえた問題《もんだい》と解説《かいせつ》')} <span class="sub">Pembahasan</span></h2>${wrong}</div>`
  : `<div class="card" style="text-align:center">🎉 ${R('全問《ぜんもん》正解《せいかい》です！')} Semua benar!</div>`}
  <button class="btn sec mt" onclick="go('home')" style="margin-bottom:24px">🏠 ${R('ホームへ')}</button>`;
}
function retryWrong() {
  const qs = RESULT.wrong.map(it => it.q);
  S = makeSession('practice', shuffle(qs), 'もう一度');
  VIEW = 'quiz'; render(); window.scrollTo(0, 0); autoPlay();
}

// ---------- 成績 ----------
function viewStats() {
  const bars = Object.keys(CATS).map(c => {
    const s = catStats(c);
    const p = s.pct;
    return `<div class="bar-row"><span>${CATS[c].ic} ${catName(c)}</span>
      <div class="bar"><i class="${p === null ? '' : p >= 80 ? 'good' : p < PASS_LINE ? 'weak' : ''}" style="width:${p || 0}%"></i></div>
      <span class="pct">${p === null ? '-' : p + '%'}</span></div>
      <div class="sub" style="margin:-4px 0 6px 0;padding-left:2px">${R('解《と》いた')} ${s.seen}/${s.total}・${R('覚《おぼ》えた')} ${s.mastered}</div>`;
  }).join('');
  const hist = DB.hist.slice().reverse().slice(0, 10).map(h =>
    `<div class="hist"><span>${new Date(h.d).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
     <span>${(MOCKS[h.type] || MOCKS.main).short}　${h.correct}/${h.total}${R('問《もん》')}</span><b style="color:${(h.pts != null ? h.pts >= (MOCKS[h.type] || MOCKS.main).passPts : h.pct >= (MOCKS[h.type] || MOCKS.main).pass) ? 'var(--ok)' : 'var(--ng)'}">${h.pts != null ? h.pts + R('点《てん》') : h.pct + '%'}</b></div>`).join('');
  return `
  <div class="card"><h2>${R('分野別《ぶんやべつ》の正答率《せいとうりつ》')} <span class="sub">Persentase benar</span></h2>${bars}
    <div class="sub mt">🟩 80%${R("以上《いじょう》")}　🟧 ${PASS_LINE}〜79%　🟥 ${PASS_LINE}%${R('未満《みまん》')}（${R('苦手《にがて》')}）</div></div>
  <div class="card"><h2>${R('模擬試験《もぎしけん》の記録《きろく》')} <span class="sub">Riwayat ujian simulasi</span></h2>
    ${hist || `<div class="sub">${R('まだありません')}</div>`}</div>
  <button class="btn sec" onclick="go('home')">← ${R('もどる')}</button>
  <button class="btn ghost mt" style="margin-bottom:24px" onclick="resetAll()">🗑 ${R('記録《きろく》をリセット')}</button>`;
}
function resetAll() {
  if (!confirm('すべての学習記録を消しますか？\n(Hapus semua catatan belajar?)')) return;
  DB.srs = {}; DB.hist = []; save(); toast('リセットしました'); render();
}

// ---------- キーボード（PC用） ----------
document.addEventListener('keydown', e => {
  if (VIEW !== 'quiz' || !S || e.target.tagName === 'INPUT') return;
  const it = S.items[S.idx];
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) {
    if (it.q.t === 'tf') { if (n <= 2) pick(n - 1); }
    else if (it.order[n - 1] !== undefined) pick(it.order[n - 1]);
  } else if (e.key === 'Enter' || e.key === 'ArrowRight') {
    if (S.mode === 'mock') { if (S.idx < S.items.length - 1) move(1); }
    else if (it.done) next();
  } else if (e.key === 'ArrowLeft' && S.mode === 'mock') move(-1);
});

// =====================================================================
//  ログイン
// =====================================================================
function doLogin() {
  if (checkPassword(document.getElementById('pw').value)) {
    lsSet('shokuhin_auth', '2');
    showApp();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}
function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  updateToggles(); render();
}
if (lsGet('shokuhin_auth') === '2') showApp();
</script>
</body>
